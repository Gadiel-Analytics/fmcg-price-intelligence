name: Daily Price Scrape

# Orchestration: runs once daily on GitHub's hosted runner. Tests gate the run;
# the quality gate in run.py refuses partial scrapes; only then is the data
# committed back to the repository (the commit history is the audit trail).
on:
  schedule:
    - cron: "0 8 * * *"     # 08:00 UTC every day
  workflow_dispatch: {}      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed to commit the updated data back to the repo

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (offline)
        run: python -m pytest -q

      - name: Scrape, quality gate, ingest, export cube, build pages
        run: python run.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ index.html sitemap.xml robots.txt
          git diff --staged --quiet || git commit -m "Daily price data: $(date -u +%Y-%m-%d)"
          git push

name: Daily Price Scrape
on:
  schedule:
    - cron: '17 8 * * *' # UTC; avoid the top-of-hour queue. Scheduling is best-effort.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scrapers/**'
      - 'sql/**'
      - 'config/**'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*'
      - 'run.py'
      - '.github/workflows/daily-scrape.yml'
permissions:
  contents: write
concurrency:
  group: daily-scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run tests (offline)
        run: python -m pytest -q
      - name: Scrape, quality gate, ingest, export cube, build pages
        shell: bash
        run: python run.py | tee "$RUNNER_TEMP/daily-scrape.log"
      - name: Validate data and generated pages
        run: python scripts/check_release.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ index.html sitemap.xml robots.txt
          git diff --staged --quiet || git commit -m "Daily price data: $(date -u +%Y-%m-%d)"
          git push
      - name: Verify production matches this run
        run: python scripts/verify_production.py --attempts 15 --delay 20
      - name: Preserve collection log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-scrape-log-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-scrape.log
          if-no-files-found: ignore
          retention-days: 14

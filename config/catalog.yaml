# =============================================================================
# Catalog — Carbonated soft drinks & energy @ SuperValu Ireland
# =============================================================================
# Search-query driven: the scraper runs each query against SuperValu's search,
# extracts every product card, and keeps those matching a configured brand.
# Add coverage by adding a search term or a brand — no product IDs to maintain.
#
# sugar_class / variant / container are inferred from the product name in code
# (see classify_* in scrapers/scraper.py); flavour and caffeine flags are derived
# from the title in sql/01_observations.sql, so they apply to the full history.
# =============================================================================

retailer:
  name: "SuperValu Ireland"
  code: "supervalu_ie"
  rsid: "5550"
  search_url: "https://shop.supervalu.ie/sm/delivery/rsid/{rsid}/results?q={query}"
  currency: "EUR"
  market: "IE"

# Search terms to sweep. Each returns many cards; `brands` trims to the portfolio.
search_queries:
  - "coca cola"
  - "coca cola zero"
  - "diet coke"
  - "pepsi"
  - "pepsi max"
  - "7up"
  - "sprite"
  - "fanta"
  - "club orange"
  - "cola"
  - "red bull"
  - "monster energy"

# Brands to keep, in priority order (first match wins). A card is kept when its
# brand label — or its title, if the card has no brand label — contains one of
# the `match` terms (case-insensitive, hyphens ignored).
#   family      reporting name used across the dashboard
#   owner       brand owner, for competitive context
#   segment     like-for-like comparison group; the first family listed in a
#               segment is its reference brand (index = 100)
#   zero_terms  title terms meaning "no sugar" for this brand, on top of the
#               defaults ("zero sugar", "no sugar", "zero"). "Caffeine free"
#               and "zero caffeine" are removed before matching.
#   title_must_contain   extra guard for broad brand labels (own-label)
brands:
  - family: "Coca-Cola"
    owner: "The Coca-Cola Company"
    segment: "Cola"
    match: ["coca cola", "diet coke", "coke"]
  - family: "Pepsi"
    owner: "PepsiCo"
    segment: "Cola"
    match: ["pepsi"]
    zero_terms: ["max"]
  - family: "SuperValu own-label"
    owner: "Musgrave (SuperValu)"
    segment: "Cola"
    private_label: true
    match: ["supervalu"]
    title_must_contain: ["cola"]
  - family: "Sprite"
    owner: "The Coca-Cola Company"
    segment: "Lemon-lime"
    match: ["sprite"]
  - family: "7UP"
    owner: "PepsiCo"
    segment: "Lemon-lime"
    match: ["7up", "7 up"]
    zero_terms: ["free"]
  - family: "Fanta"
    owner: "The Coca-Cola Company"
    segment: "Orange & fruit"
    match: ["fanta"]
  - family: "Club"
    owner: "Britvic"
    segment: "Orange & fruit"
    match: ["club"]
    title_must_contain: ["orange", "lemon", "rock shandy", "apple", "zero"]
  - family: "Red Bull"
    owner: "Red Bull"
    segment: "Energy"
    match: ["red bull"]
    zero_terms: ["sugarfree", "sugar free"]
  - family: "Monster"
    owner: "Monster Beverage"
    segment: "Energy"
    match: ["monster"]
    zero_terms: ["ultra"]

# Head-to-head pairs: each hero brand against its direct rival, matched pack for
# pack (same pack size, count, container and sugar tier) on the price paid today.
# require_title / exclude_title narrow each side to the comparable range.
# adjacent: a different category shown separately from the core cola story.
competitive_pairs:
  - hero: "Coca-Cola"
    rival: "Pepsi"
    label: "Cola"
  - hero: "Sprite"
    rival: "7UP"
    label: "Lemon-lime"
    exclude_title: ["pink", "cherry", "cranberry", "lemonade"]
  - hero: "Fanta"
    rival: "Club"
    label: "Orange"
    require_title: ["orange"]
  - hero: "Monster"
    rival: "Red Bull"
    label: "Energy"
    adjacent: true

# Titles containing any of these terms are dropped even if the brand matches
# (e.g. spirit-and-cola ready-to-drink cans that carry a soft-drink name).
exclude_title_terms: ["whiskey", "rum", "vodka", "jack daniel"]

analysis:
  # A SKU counts as "active" if it was observed within this many days of the
  # latest run. Keeps transient gaps from dropping SKUs, and keeps delisted
  # SKUs out of the current-price views.
  active_window_days: 2
  # Sugar Sweetened Drinks Tax, top band (>= 8 g sugar / 100 ml): EUR 24.39/hl
  # ex-VAT (Revenue.ie), i.e. EUR 0.2439/L; x 1.23 VAT = EUR 0.30/L at shelf.
  # Used as a benchmark for the full-sugar vs Zero spread — not as proof of
  # pass-through (the spread also reflects commercial choices).
  levy_per_litre_incl_vat: 0.30
  levy_source: "https://www.revenue.ie/en/companies-and-charities/excise-and-licences/sugar-sweetened-drinks-tax/rate-of-tax.aspx"
  # Levy by date, so a rate change is one new line. The benchmark uses the rate
  # in force on the latest run date; levy_per_litre_incl_vat above is the fallback.
  levy_schedule:
    - from: "2018-05-01"
      per_litre_incl_vat: 0.30
      note: "SSDT top band (>= 8 g sugar/100 ml): EUR 24.39/hl ex-VAT"
  # Days compared on each side of a dated event (before vs from the event date).
  event_window_days: 14
  # Days covered by the "What changed" feed on the Summary.
  change_feed_days: 7

# Dated events annotated on time series and studied before/after automatically.
# kind: policy | seasonal. An announcement and its effective date are separate
# events when both are known (the SSDT was announced in October 2016 and took
# effect in 2018).
events:
  - id: "budget-2027"
    date: "2026-10-06"
    label: "Budget 2027"
    kind: "policy"
    detail: "Budget 2027 announcement. Any change to the Sugar Sweetened Drinks Tax would appear here first."
    source: "https://kpmg.com/ie/en/insights/tax/budget-2027.html"
    # What was announced, once known. Until the Finance Bill is enacted, this is
    # the official summary, not the legislation.
    outcome: "No change to the Sugar Sweetened Drinks Tax in the official Budget 2027 summary; to be confirmed against the Finance Bill."
    outcome_source: "https://www.citizensinformation.ie/en/money-and-tax/budgets/budget-2027/"
    levy_changed: false

quality:
  # Refuse to ingest a run whose SKU count falls below this share of the
  # trailing 7-day median (protects the history from partial or broken scrapes).
  min_share_of_recent_median: 0.5

compliance:
  request_delay_seconds: [3, 7]
  max_skus_per_run: 200         # hard cap across all queries in one run
  user_agent: "GadielAnalytics-PriceIntel/0.2 (portfolio research; +github.com/Gadiel-Analytics)"
